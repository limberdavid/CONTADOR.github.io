<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limber Counter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="card">

    <h1 class="logo">LIMBER</h1>

    <div class="counter-box">
        <span id="contador">0</span>
    </div>

    <div class="controls">
        <button id="btnDecrementar" class="btn danger">−</button>
        <button id="btnResetear" class="btn neutral">RESET</button>
        <button id="btnIncrementar" class="btn success">+</button>
    </div>

    <div class="controls small">
        <button id="btnDecrementar5" class="btn ghost danger">−5</button>
        <button id="btnIncrementar5" class="btn ghost success">+5</button>
    </div>

    <p id="mensaje" class="status">El contador está en cero</p>

</div>

<script src="script.js"></script>
</body>
</html>
